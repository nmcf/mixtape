<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    padding: 2px 2px 4px;
    user-select: none;
  }
  .title {
    color: #aaa;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 4px;
  }
  .fader { width: 100%; cursor: pointer; }
  svg { display: block; margin: 0 auto; height: 150px; width: auto; max-width: 100%; }
</style>
</head>
<body>
<div class="title" id="title"></div>
<div class="fader" id="fader"></div>

<script>
// ── Geometry (viewBox 124 x 150) — vertical fader ───────────────────────────
var VBW = 124, VBH = 150;
var CX = 30;                 // track centre x
var TRACK_TOP = 26, TRACK_BOT = 124;

function slotY(i, n) {
  return TRACK_TOP + (i / (n - 1)) * (TRACK_BOT - TRACK_TOP);
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildSVG(idx, opts) {
  var n = opts.length;
  var cy = slotY(idx, n);

  // Tick marks flanking the track + option labels to the right
  var ticks = '', labels = '';
  for (var i = 0; i < n; i++) {
    var y = slotY(i, n);
    var on = i === idx;
    var col = on ? '#e8c84a' : '#555';
    var w = on ? 1.4 : 0.9;
    ticks += '<line x1="' + (CX - 11) + '" y1="' + y.toFixed(1) + '" x2="' + (CX - 7) + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>' +
             '<line x1="' + (CX + 7) + '" y1="' + y.toFixed(1) + '" x2="' + (CX + 11) + '" y2="' + y.toFixed(1) + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>';
    labels += '<text x="52" y="' + (y + 3).toFixed(1) + '" font-size="10" font-weight="700" ' +
              'letter-spacing="0.04em" fill="' + (on ? '#e8c84a' : '#888') + '" ' +
              'style="text-transform:uppercase">' + esc(opts[i]) + '</text>';
  }

  // Fader cap: a wide, short cap that slides vertically
  var capW = 26, capH = 12, capX = (CX - capW / 2).toFixed(1), capY = (cy - capH / 2).toFixed(1);

  return '' +
  '<svg viewBox="0 0 ' + VBW + ' ' + VBH + '" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
      '<linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0%" stop-color="#242424"/>' +
        '<stop offset="100%" stop-color="#171717"/>' +
      '</linearGradient>' +
      '<linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%"  stop-color="#5a5a5a"/>' +
        '<stop offset="12%" stop-color="#3e3e3e"/>' +
        '<stop offset="50%" stop-color="#2c2c2c"/>' +
        '<stop offset="88%" stop-color="#3e3e3e"/>' +
        '<stop offset="100%" stop-color="#202020"/>' +
      '</linearGradient>' +
    '</defs>' +

    // Channel strip
    '<rect x="14" y="12" width="32" height="126" rx="6" fill="url(#strip)" stroke="#3a3a3a" stroke-width="1"/>' +

    // Recessed vertical travel groove (+ faint highlight edge)
    '<rect x="' + (CX - 1.6) + '" y="' + TRACK_TOP + '" width="3.2" height="' + (TRACK_BOT - TRACK_TOP) + '" rx="1.6" fill="#000"/>' +
    '<rect x="' + (CX + 0.2) + '" y="' + TRACK_TOP + '" width="0.8" height="' + (TRACK_BOT - TRACK_TOP) + '" rx="0.4" fill="#444" opacity="0.4"/>' +

    ticks +

    // Fader cap — body, top bevel, bright centre indicator
    '<rect x="' + capX + '" y="' + capY + '" width="' + capW + '" height="' + capH + '" rx="2.5" fill="url(#cap)" stroke="#666" stroke-width="0.7"/>' +
    '<rect x="' + capX + '" y="' + capY + '" width="' + capW + '" height="2.5" rx="1.2" fill="#6a6a6a" opacity="0.6"/>' +
    '<line x1="' + (CX - capW / 2 + 2).toFixed(1) + '" y1="' + cy.toFixed(1) + '" x2="' + (CX + capW / 2 - 2).toFixed(1) + '" y2="' + cy.toFixed(1) + '" stroke="#e8c84a" stroke-width="1.6" stroke-linecap="round"/>' +

    labels +
  '</svg>';
}

// ── State ────────────────────────────────────────────────────────────────────
var options = [];
var idx = 0;
var initialised = false;

function render() {
  document.getElementById('fader').innerHTML = buildSVG(idx, options);
  sendHeight();
}

// ── Streamlit messaging ───────────────────────────────────────────────────────
function sendHeight() {
  var h = document.body.scrollHeight + 2;
  window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setFrameHeight', height: h }, '*');
}
function sendValue() {
  window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:setComponentValue', value: options[idx] }, '*');
}

function setIndex(i) {
  if (i < 0 || i >= options.length || i === idx) return;
  idx = i;
  render();
  sendValue();
}

// Click anywhere on the fader → snap to the nearest detent by vertical position
document.getElementById('fader').addEventListener('click', function(e) {
  var svg = this.querySelector('svg');
  if (!svg) return;
  var rect = svg.getBoundingClientRect();
  var vy = (e.clientY - rect.top) / rect.height * VBH;   // click y in viewBox units
  var frac = (vy - TRACK_TOP) / (TRACK_BOT - TRACK_TOP);  // 0 top .. 1 bottom
  var n = options.length;
  var best = Math.round(frac * (n - 1));
  setIndex(Math.max(0, Math.min(n - 1, best)));
});

// ── Streamlit render event ─────────────────────────────────────────────────
var lastNonce;
window.addEventListener('message', function(e) {
  try {
    var data = e.data;
    if (!data || typeof data !== 'object' || data.type !== 'streamlit:render') return;
    var args = data.args || {};
    var opts = args.options || [];
    if (!opts.length) return;

    document.getElementById('title').textContent = args.title || '';

    if (!initialised) {
      options = opts;
      idx = Math.max(0, options.indexOf(args.value));
      lastNonce = args.nonce;
      render();
      initialised = true;
    } else if (args.nonce !== undefined && args.nonce !== lastNonce) {
      // Preset / Auto-Tune / Reset changed the value from Python — re-sync
      idx = Math.max(0, options.indexOf(args.value));
      lastNonce = args.nonce;
      render();
      sendValue();
    }
    // else: ordinary rerun — the switch owns its state, ignore.
  } catch (err) {
    document.body.innerHTML = '<div style="color:#c44;font-size:10px">switch error: ' + err.message + '</div>';
  }
});

window.parent.postMessage({ isStreamlitMessage: true, type: 'streamlit:componentReady', apiVersion: 1 }, '*');
</script>
</body>
</html>
